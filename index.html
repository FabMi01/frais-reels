<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Frais Réels" />
  <title>Frais Réels</title>
  <link rel="manifest" id="pwa-manifest" />
  <meta name="theme-color" content="#0f0f13" />
  <link rel="apple-touch-icon" id="apple-icon" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Thème sombre (défaut) ── */
    :root {
      --bg:       #0f0f13;
      --bg2:      #16161e;
      --bg3:      #1a1a22;
      --bg4:      #1e2030;
      --border:   #2a2a38;
      --border2:  #2a2a44;
      --text:     #e8e0d0;
      --text2:    #888;
      --text3:    #aaa;
      --text4:    #666;
      --gold:     #c8a96e;
      --gold-dim: #c8a96e22;
      --gold-dim2:#c8a96e44;
      --summary-bg: #0f0f13;
      --divider:  #2a2a38;
      --toggle-off: #2a2a38;
      --inner-bg: #1a1a28;
      --footer:   #333;
      --h1:       #f0e8d8;
      --sub:      #555;
    }
    /* ── Thème clair ── */
    [data-theme="light"] {
      --bg:       #f4f1eb;
      --bg2:      #ffffff;
      --bg3:      #f0ede6;
      --bg4:      #e8e4dc;
      --border:   #ddd8cc;
      --border2:  #d0cbbe;
      --text:     #1a1610;
      --text2:    #777;
      --text3:    #555;
      --text4:    #999;
      --gold:     #a07838;
      --gold-dim: #a0783818;
      --gold-dim2:#a0783830;
      --summary-bg: #faf8f4;
      --divider:  #e0dbd0;
      --toggle-off: #ccc;
      --inner-bg: #f0ede6;
      --footer:   #bbb;
      --h1:       #1a1610;
      --sub:      #999;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: "Georgia", serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      transition: background 0.3s, color 0.3s;
    }
    input[type=number], input[type=date], select, input[type=text] {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 16px;
      width: 100%;
      font-family: "Georgia", serif;
      outline: none;
      transition: border 0.2s;
      -webkit-appearance: none;
    }
    input:focus, select:focus { border-color: var(--gold); }
    .card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      transition: background 0.3s, border-color 0.3s;
    }
    .label {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text2);
      margin-bottom: 6px;
      display: block;
    }
    .result-num {
      font-size: 42px;
      font-weight: bold;
      color: var(--gold);
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    .result-sub { font-size: 13px; color: var(--text2); margin-top: 4px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-family: "Georgia", serif;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
      width: 100%;
    }
    .btn-gold { background: var(--gold); color: var(--bg); font-weight: bold; }
    .btn-gold:active { filter: brightness(1.1); }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text3); }
    .btn-outline:active { border-color: var(--gold); color: var(--gold); }
    .btn-danger {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text3);
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 8px;
      cursor: pointer;
      font-family: "Georgia", serif;
    }
    .btn-danger:active { border-color: #a44; color: #f88; }
    .tab-bar { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab {
      flex: 1;
      padding: 12px 8px;
      border-radius: 12px;
      font-family: "Georgia", serif;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg2);
      color: var(--text4);
      text-align: center;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .tab.active { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); }
    .summary-box {
      background: var(--summary-bg);
      border: 1px solid var(--gold-dim2);
      border-radius: 12px;
      padding: 16px;
      font-size: 15px;
      line-height: 1.9;
      color: var(--text);
    }
    .tag {
      display: inline-block;
      background: var(--bg4);
      border: 1px solid var(--border2);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 12px;
      color: var(--text3);
      margin: 2px;
    }
    .section-title { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold); margin-bottom: 12px; }
    .divider { height: 1px; background: var(--divider); margin: 16px 0; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; }
    .toggle-label { font-size: 14px; color: var(--text3); }
    .toggle {
      width: 44px; height: 26px; border-radius: 13px;
      background: var(--toggle-off);
      position: relative; cursor: pointer;
      transition: background 0.2s; border: none;
      -webkit-tap-highlight-color: transparent; flex-shrink: 0;
    }
    .toggle.on { background: var(--gold); }
    .toggle::after {
      content: ""; position: absolute;
      width: 20px; height: 20px; border-radius: 50%;
      background: white; top: 3px; left: 3px;
      transition: transform 0.2s;
    }
    .toggle.on::after { transform: translateX(18px); }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .animate { animation: fadeIn 0.3s ease; }
    .footer { text-align: center; font-size: 11px; color: var(--footer); margin-top: 8px; padding-bottom: 24px; }

    /* Bouton thème */
    .theme-btn {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 14px;
      cursor: pointer;
      color: var(--text3);
      font-family: "Georgia", serif;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.2s;
    }
    .theme-btn:active { border-color: var(--gold); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const FERIES = {
      2025: ["2025-01-01","2025-04-21","2025-05-01","2025-05-08","2025-05-29","2025-06-09","2025-07-14","2025-08-15","2025-11-01","2025-11-11","2025-12-25"],
      2026: ["2026-01-01","2026-04-06","2026-05-01","2026-05-08","2026-05-14","2026-05-25","2026-07-14","2026-08-15","2026-11-01","2026-11-11","2026-12-25"],
      2027: ["2027-01-01","2027-03-29","2027-05-01","2027-05-06","2027-05-08","2027-05-17","2027-07-14","2027-08-15","2027-11-01","2027-11-11","2027-12-25"],
      2028: ["2028-01-01","2028-04-17","2028-05-01","2028-05-08","2028-05-25","2028-06-05","2028-07-14","2028-08-15","2028-11-01","2028-11-11","2028-12-25"],
      2029: ["2029-01-01","2029-04-02","2029-05-01","2029-05-08","2029-05-10","2029-05-21","2029-07-14","2029-08-15","2029-11-01","2029-11-11","2029-12-25"],
      2030: ["2030-01-01","2030-04-22","2030-05-01","2030-05-08","2030-05-30","2030-06-10","2030-07-14","2030-08-15","2030-11-01","2030-11-11","2030-12-25"],
    };

    // Lundi de Pentecôte par année
    const PENTECOTE = {
      2025: "2025-06-09", 2026: "2026-05-25", 2027: "2027-05-17",
      2028: "2028-06-05", 2029: "2029-05-21", 2030: "2030-06-10",
    };

    const BAREME_DEFAULT_6CV  = { t1: 0.665, t1b: 0.374, t1c: 1457, t2: 0.447 };
    const BAREME_DEFAULT_5CV  = { t1: 0.636, t1b: 0.357, t1c: 1395, t2: 0.427 };
    const BAREME_DEFAULT_4CV_EV = { t1: 0.727, t1b: 0.408, t1c: 1596, t2: 0.488 }; // voitures 100 % électriques 4 CV (+20 %)

    function baremeKm(km, taux) {
      const { t1, t1b, t1c, t2 } = taux;
      if (km <= 0)     return 0;
      if (km <= 5000)  return km * t1;
      if (km <= 20000) return (km * t1b) + t1c;
      return km * t2;
    }

    function toKey(d) {
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    }
    function fmt(d) {
      return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;
    }
    function parseLocal(str) {
      const [y,m,d] = str.split("-").map(Number);
      return new Date(y, m-1, d);
    }

    function calcul({ annee, conges, distance, taux, avecTeletravail, pentecoteTravaille, periode }) {
      const feriesBase = new Set(FERIES[annee] || []);
      if (pentecoteTravaille && PENTECOTE[annee]) feriesBase.delete(PENTECOTE[annee]);
      const feries = feriesBase;
      const congesSet = new Set();
      const congesDetail = [];

      for (const { debut, fin } of conges) {
        if (!debut || !fin) { congesDetail.push(0); continue; }
        const cur = parseLocal(debut);
        const end = parseLocal(fin);
        let count = 0;
        while (cur <= end) {
          const key = toKey(cur);
          const dow = cur.getDay();
          if (dow >= 1 && dow <= 5 && !feries.has(key)) count++;
          congesSet.add(key);
          cur.setDate(cur.getDate()+1);
        }
        congesDetail.push(count);
      }

      const jours = [], vendredis = [];
      let congesOuvres = 0;
      const cur = new Date(annee, 0, 1);
      const end = new Date(annee, 11, 31);
      while (cur <= end) {
        const dow = cur.getDay();
        const key = toKey(cur);
        const isOuvre = dow >= 1 && dow <= 5 && (!periode || (key >= periode.debut && key <= periode.fin));
        if (isOuvre && !feries.has(key) && !congesSet.has(key)) {
          jours.push(new Date(cur));
          if (dow === 5) vendredis.push(new Date(cur));
        }
        if (isOuvre && !feries.has(key) && congesSet.has(key)) congesOuvres++;
        cur.setDate(cur.getDate()+1);
      }
      const joursPresentiels = avecTeletravail ? jours.length - vendredis.length : jours.length;
      const teletravail = avecTeletravail ? vendredis.length : 0;
      const kmTotal = joursPresentiels * distance;
      const frais = baremeKm(kmTotal, taux);
      const congesOuvresTotal = congesDetail.reduce((a, b) => a + b, 0);
      return {
        travailles: jours.length,
        teletravail,
        presentiel: joursPresentiels,
        km: kmTotal,
        frais: Math.round(frais),
        congesOuvres: congesOuvresTotal,
        congesDetail,
        vendredisListe: vendredis
      };
    }

    const defaultCongesA = [
      { debut: "2025-04-22", fin: "2025-04-25" },
      { debut: "2025-05-27", fin: "2025-05-30" },
      { debut: "2025-07-28", fin: "2025-08-14" },
      { debut: "2025-12-22", fin: "2025-12-26" },
    ];


    // localStorage uniquement
    function loadSaved(key, fallback) {
      try {
        const v = localStorage.getItem(key);
        return v ? JSON.parse(v) : fallback;
      } catch(e) { return fallback; }
    }
    function save(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
    }

    function collectAll() {
      const keys = [
        "app_annee","app_tab","app_dark",
        "stonic_distance","stonic_tt","stonic_taux","stonic_pent",
        "kadjar_distance","kadjar_tt","kadjar_taux","kadjar_pent",
        "mg4_distance","mg4_tt","mg4_taux","mg4_pent",
      ];
      [2025,2026,2027,2028,2029,2030].forEach(y => {
        keys.push(`stonic_conges_${y}`, `kadjar_conges_${y}`, `mg4_conges_${y}`);
      });
      const data = {};
      keys.forEach(k => {
        try { const v = localStorage.getItem(k); if (v) data[k] = JSON.parse(v); } catch(e) {}
      });
      return data;
    }

    function restoreAll(data) {
      if (!data) return;
      Object.entries(data).forEach(([k, v]) => {
        try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {}
      });
    }

    function scheduleSbSave() {} // no-op

    function parseInputDate(val, annee) {
      const digits = val.replace(/\//g,'');
      if (digits.length >= 6) {
        const d = digits.slice(0,2).padStart(2,'0');
        const m = digits.slice(2,4).padStart(2,'0');
        let y;
        if (digits.length >= 8) {
          y = digits.slice(4,8);
        } else {
          // 2 chiffres : 25 → 2025
          const yy = digits.slice(4,6);
          y = '20' + yy;
        }
        const full = `${y}-${m}-${d}`;
        const dt = new Date(full);
        if (!isNaN(dt.getTime())) return full;
      }
      return "";
    }

    function formatDisplay(isoDate) {
      if (!isoDate) return "";
      const [y,m,d] = isoDate.split('-');
      return `${d}/${m}/${y}`;
    }

    function VehiculePanel({ vehicule, annee, periode, onResult }) {
      const sk = vehicule.id;
      const [distanceAR, setDistanceAR] = useState(() => loadSaved(`${sk}_distance`, vehicule.distanceDefault));
      const [conges, setConges] = useState(() => loadSaved(`${sk}_conges_${annee}`, []));
      const [avecTeletravail, setAvecTeletravail] = useState(() => loadSaved(`${sk}_tt`, vehicule.teletravailDefault));
      const [pentecoteTravaille, setPentecoteTravaille] = useState(() => loadSaved(`${sk}_pent`, false));
      const [taux, setTaux] = useState(() => loadSaved(`${sk}_taux`, vehicule.baremeDefault));
      const [result, setResult] = useState(null);
      const [showVendredis, setShowVendredis] = useState(false);
      const [showBareme, setShowBareme] = useState(false);
      const [copied, setCopied] = useState(false);

      function updateTaux(field, val) {
        const v = parseFloat(val.replace(",", "."));
        setTaux(prev => ({ ...prev, [field]: isNaN(v) ? 0 : v }));
      }

      useEffect(() => {
        setResult(calcul({ annee, conges, distance: distanceAR, taux, avecTeletravail, pentecoteTravaille, periode }));
      }, [annee, JSON.stringify(conges), distanceAR, JSON.stringify(taux), avecTeletravail, pentecoteTravaille, JSON.stringify(periode)]);

      useEffect(() => { if (onResult && result) onResult(vehicule.id, result); }, [result]);

      useEffect(() => { save(`${sk}_distance`, distanceAR); }, [distanceAR]);
      useEffect(() => { save(`${sk}_conges_${annee}`, conges); }, [JSON.stringify(conges)]);
      useEffect(() => { save(`${sk}_tt`, avecTeletravail); }, [avecTeletravail]);
      useEffect(() => { save(`${sk}_taux`, taux); }, [JSON.stringify(taux)]);
      useEffect(() => { save(`${sk}_pent`, pentecoteTravaille); }, [pentecoteTravaille]);

      // Charger les congés de l'année sélectionnée
      const prevAnneeRef = React.useRef(annee);
      useEffect(() => {
        if (prevAnneeRef.current !== annee) {
          const loaded = loadSaved(`${sk}_conges_${annee}`, annee === 2025 ? vehicule.congesDefault : []);
          setConges(loaded);
          setCongesRaw(loaded.map(c => ({ debut: formatDisplay(c.debut), fin: formatDisplay(c.fin) })));
          prevAnneeRef.current = annee;
        }
      }, [annee]);

      function addConge() {
        setConges([...conges, { debut: "", fin: "" }]);
        setCongesRaw([...congesRaw, { debut: "", fin: "" }]);
      }
      function removeConge(i) {
        setConges(conges.filter((_,idx) => idx !== i));
        setCongesRaw(congesRaw.filter((_,idx) => idx !== i));
      }
      // État brut de saisie (texte affiché) séparé des dates ISO
      const [congesRaw, setCongesRaw] = useState(() =>
        loadSaved(`${sk}_conges_${annee}`, []).map(c => ({ debut: formatDisplay(c.debut), fin: formatDisplay(c.fin) }))
      );

      // Sync congesRaw quand conges change (ex: changement d'année)
      const syncRaw = (newConges) => {
        setCongesRaw(newConges.map(c => ({ debut: formatDisplay(c.debut), fin: formatDisplay(c.fin) })));
      };

      function autoFormat(val) {
        let clean = val.replace(/[^0-9\/]/g,'');
        const digits = clean.replace(/\//g,'');
        if (digits.length <= 2) return digits;
        if (digits.length <= 4) return digits.slice(0,2) + '/' + digits.slice(2);
        if (digits.length <= 6) return digits.slice(0,2) + '/' + digits.slice(2,4) + '/' + digits.slice(4,6);
        return digits.slice(0,2) + '/' + digits.slice(2,4) + '/' + digits.slice(4,8);
      }

      function expandYear(val) {
        // Transforme JJ/MM/YY en JJ/MM/YYYY si l'année est sur 2 chiffres
        const parts = val.split('/');
        if (parts.length === 3 && parts[2].length === 2) {
          return parts[0] + '/' + parts[1] + '/20' + parts[2];
        }
        return val;
      }

      function handleFocus(i, field) {
        setCongesRaw(congesRaw.map((r,idx) => idx === i ? {...r, [field]: ""} : r));
      }

      function handleBlur(i, field) {
        const raw = congesRaw[i] ? congesRaw[i][field] : "";
        const expanded = expandYear(raw);
        if (expanded !== raw) {
          setCongesRaw(congesRaw.map((r,idx) => idx === i ? {...r, [field]: expanded} : r));
          const iso = parseInputDate(expanded, annee);
          if (iso) setConges(conges.map((c,idx) => idx === i ? {...c, [field]: iso} : c));
        }
        // Restore display value if field is empty after focus
        if (!raw) {
          const isoVal = conges[i] ? conges[i][field] : "";
          setCongesRaw(congesRaw.map((r,idx) => idx === i ? {...r, [field]: formatDisplay(isoVal)} : r));
        }
      }

      function handleDebutChange(i, val) {
        const clean = autoFormat(val);
        const newRaw = congesRaw.map((r,idx) => idx === i ? {...r, debut: clean} : r);
        const iso = parseInputDate(clean, annee);
        if (iso) {
          const finIsEmpty = !conges[i] || conges[i].fin === "";
          setConges(conges.map((c,idx) => idx === i ? { debut: iso, fin: finIsEmpty ? iso : c.fin } : c));
          if (finIsEmpty) {
            setCongesRaw(newRaw.map((r,idx) => idx === i ? {...r, fin: clean} : r));
            return;
          }
        }
        setCongesRaw(newRaw);
      }

      function handleFinChange(i, val) {
        const clean = autoFormat(val);
        setCongesRaw(congesRaw.map((r,idx) => idx === i ? {...r, fin: clean} : r));
        const iso = parseInputDate(clean, annee);
        if (iso) setConges(conges.map((c,idx) => idx === i ? {...c, fin: iso} : c));
      }

      const perRes = periode && periode.inactif ? null : (periode || { debut: `${annee}-01-01`, fin: `${annee}-12-31` });
      const dm = (iso) => iso.slice(8, 10) + "." + iso.slice(5, 7);
      const summary = result ? [
        vehicule.periode && perRes && annee === 2026 ? `${vehicule.court} du ${dm(perRes.debut)} au ${dm(perRes.fin)}.${String(annee).slice(2)}` : null,
        `${result.travailles} jours travaillés${pentecoteTravaille ? " (dont le lundi de Pentecôte : journée de solidarité)" : ""}`,
        avecTeletravail ? `- ${result.teletravail} jours de télétravail` : null,
        avecTeletravail && vehicule.showPresentiel !== false ? `soit ${result.presentiel} jours en présentiel` : null,
        `distance domicile - travail : ${distanceAR} Kms aller-retour`,
        `soit ${result.presentiel} × ${distanceAR} Kms = ${result.km.toLocaleString("fr-FR")} Kms`,
        `Voiture : ${vehicule.nom}`,
        `Soit ${result.frais.toLocaleString("fr-FR")} €`,
      ].filter(Boolean).join("\n") : "";

      function copier() {
        const txt = summary;
        if (navigator.clipboard) {
          navigator.clipboard.writeText(txt).then(() => { setCopied(true); setTimeout(() => setCopied(false), 2000); });
        } else {
          const ta = document.createElement("textarea");
          ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
          setCopied(true); setTimeout(() => setCopied(false), 2000);
        }
      }

      return (
        <div className="animate">
          {/* Distance + Toggle TT */}
          <div className="card">
            <div className="section-title">Paramètres — {vehicule.nom}</div>
            <div style={{marginBottom:12}}>
              <span className="label">Distance A/R (km)</span>
              <input type="number" value={distanceAR} min={2} step={2}
                onChange={e => setDistanceAR(Number(e.target.value))} />
            </div>
            {vehicule.showTeletravail !== false && (
              <div className="toggle-row">
                <span className="toggle-label">Vendredis en télétravail</span>

            <div key={v.id} style={{display: activeId === v.id ? "block" : "none"}}>
              <VehiculePanel vehicule={v} annee={annee} periode={v.periode ? v.periode(annee) : null} onResult={(id, r) => setRes(p => ({ ...p, [id]: r }))} />
            </div>
          ))}

          {(() => {
            const g = {};
            visibles.forEach(v => { const r = res[v.id]; if (r && r.km > 0) (g[v.caseImpot] = g[v.caseImpot] || []).push({ v, r }); });
            return Object.entries(g).filter(([, a]) => a.length > 1).map(([c, a]) => (
              <div key={c} style={{marginTop:16, padding:14, borderRadius:10, background:"var(--bg)", textAlign:"center", fontSize:13, color:"var(--text2)"}}>
                <div style={{fontSize:15, letterSpacing:"0.1em", textTransform:"uppercase", color:"var(--text3)"}}>
                  Case <span style={{color:"#e05555", fontWeight:"bold", fontSize:17}}>{c}</span> — Total {annee}
                </div>
                <div style={{fontSize:22, fontWeight:"bold", margin:"6px 0", color:"var(--gold)"}}>
                  {a.reduce((t, x) => t + x.r.frais, 0).toLocaleString("fr-FR")} €
                </div>
                {a.map(x => x.v.nom.split(" ").slice(0, 2).join(" ") + " : " + x.r.frais.toLocaleString("fr-FR") + " € (" + x.r.km.toLocaleString("fr-FR") + " km)").join("  ·  ")}
              </div>
            ));
          })()}

          <div className="footer">Jours fériés France métropole · 2025–2030</div>

          {/* Export / Import / Reset */}
          <div className="card" style={{marginTop:8}}>
            <div className="section-title">Sauvegarde des données</div>

            {/* Export */}
            <button className="btn btn-outline" style={{marginBottom:10}}
              onClick={() => {
                const data = collectAll();
                const json = JSON.stringify(data, null, 2);
                const blob = new Blob([json], {type: "application/json"});
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `frais-reels-sauvegarde-${new Date().toISOString().slice(0,10)}.json`;
                a.click();
                URL.revokeObjectURL(url);
              }}>
              📥 Exporter mes données (.json)
            </button>

            {/* Import */}
            <button className="btn btn-outline" style={{marginBottom:10}}
              onClick={() => {
                const input = document.createElement("input");
                input.type = "file";
                input.accept = ".json";
                input.onchange = e => {
                  const file = e.target.files[0];
                  if (!file) return;
                  const reader = new FileReader();
                  reader.onload = ev => {
                    try {
                      const data = JSON.parse(ev.target.result);
                      restoreAll(data);
                      window.location.reload();
                    } catch(err) {
                      alert("Fichier invalide. Veuillez choisir un fichier de sauvegarde valide.");
                    }
                  };
                  reader.readAsText(file);
                };
                input.click();
              }}>
              📤 Importer une sauvegarde (.json)
            </button>

            {/* Reset */}
            <button className="btn btn-outline" style={{fontSize:12, opacity:0.5}}
              onClick={() => {
                if (window.confirm("Vider toutes les données locales ?")) {
                  localStorage.clear();
                  window.location.reload();
                }
              }}>
              🗑 Vider le cache local
            </button>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>

  <script>
    const manifest = {
      name: "Frais Réels",
      short_name: "Frais Réels",
      description: "Calculateur frais kilométriques France",
      start_url: "./",
      display: "standalone",
      background_color: "#0f0f13",
      theme_color: "#0f0f13",
      orientation: "portrait",
      icons: [{ src: "./icon.png", sizes: "512x512", type: "image/png", purpose: "any maskable" }]
    };
